# Releases the plugin: computes the next version from the commits since the last vX.Y.Z tag, builds the plugin
# with it, publishes it to the Pebble appstore, then tags the commit and creates a GitHub release.
#
# Run it from the Actions tab or with `gh workflow run release.yml` (`-f dry_run=true` only builds). If a run
# fails after the store upload, re-run its failed jobs rather than starting a new run.
#
# The version lives only in the tags. package.json keeps 0.0.0, which marks a local build, and the build job
# stamps the release version into it before building.
#
# The store accepts this repo's GitHub OIDC token, so no store secret is stored here. Only the publish job can
# request one, and all it runs is the pinned download-artifact action, curl and jq. git-cliff, npm, pebble-tool
# and the SDK run in the build job, with a read-only token and no id-token.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto derives it from conventional commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Build and render the release notes without publishing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail, so a failed command in a pipe fails the step

env:
  APP_ID: 5e2b3937f0814d3e944258a5
  # git-cliff and pebble-tool are pinned, but not what they depend on. uv resolves those as of this date, so a
  # dependency release published later can't get into a build. Move it forward when bumping uv or pebble-tool.
  UV_EXCLUDE_NEWER: "2026-11-13T00:00:00Z"

jobs:
  # ---------------------------------------------------------------- Build
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Release only from the default branch
        if: ${{ !inputs.dry_run && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Releases are made from $DEFAULT_BRANCH. Use a dry run to try another branch."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: git-cliff derives the next version from the commits since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8" # uv itself; setup-uv takes the latest without it
          enable-cache: false

      - name: Compute the next version and release notes
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cliff() { uvx git-cliff@2.14.2 --unreleased --bump="$BUMP" "$@"; }

          tag=$(cliff --bumped-version)
          echo "Next version: $tag"
          # The SDK takes MAJOR.MINOR.PATCH, with MAJOR and MINOR up to 255.
          if ! [[ $tag =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || ((BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255)); then
            echo "::error::git-cliff computed '$tag', expected vX.Y.Z with X and Y up to 255"
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Is there nothing to release since the last release?"
            exit 1
          fi

          mkdir notes
          cliff -o notes/release-notes.md
          # The store's notes are public: only the user-facing changes, without commit ids or links.
          cliff --context | jq -r '
            [.[0].commits[] | select(.group | test("Features|Bug Fixes"))
              | .message | split("\n")[0] | "- " + (.[:1] | ascii_upcase) + .[1:]]
            | if length > 0 then join("\n") else "Maintenance release." end' > notes/store-notes.txt

          for f in notes/*; do echo "----- $f"; cat "$f"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm test

      - name: Stamp the version
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: npm pkg set version="${TAG#v}"

      - name: Install pebble-tool and the SDK
        run: |
          uv tool install pebble-tool==5.2.0
          bin=$(uv tool dir --bin)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pebble" sdk install 4.44

      - run: pebble build

      - name: Check the built version
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          mkdir dist
          pbw="dist/shopping-list-for-bring-$TAG.pbw"
          mv build/*.pbw "$pbw"
          label=$(unzip -p "$pbw" appinfo.json | jq -r .versionLabel)
          if [ "$label" != "${TAG#v}" ]; then
            echo "::error::The .pbw has version $label, expected ${TAG#v}"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pbw
          path: dist/*.pbw
          if-no-files-found: error

  # ---------------------------------------------------------------- Store
  publish:
    name: Publish to the Pebble appstore
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload the release to the store
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://appstore-api.repebble.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = null ]; then
            echo "::error::Couldn't get an OIDC token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
            --form-string "version=${TAG#v}" \
            --form-string "releaseNotes=$(<dist/store-notes.txt)" \
            --form-string isPublished=true \
            -F "pbwFile=@dist/shopping-list-for-bring-$TAG.pbw" \
            "https://appstore-api.repebble.com/api/dashboard/apps/$APP_ID/releases"
          echo

  # ---------------------------------------------------------------- GitHub release
  # Only once the store has the release, so a failed upload leaves no tag behind. Re-running this job after a
  # failure finds the release it made and stops.
  release:
    name: Tag and create the GitHub release
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" "dist/shopping-list-for-bring-$TAG.pbw" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/release-notes.md
